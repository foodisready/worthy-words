lesson:
  id: 1
  title_zh: 第一課：開篇・以古鑑今
  title_en: "Lesson 1: Opening · Learning from the Past"

proverbs:
  - id: zgxw-001
    source: [1]
    themes: [diligence-time]
    text_trad: 昔時賢文，誨汝諄諄。集韻增廣，多見多聞。
    text_simp: 昔时贤文，诲汝谆谆。集韵增广，多见多闻。
    pinyin: xī shí xián wén huì rǔ zhūn zhūn jí yùn zēng guǎng duō jiàn duō wén
    jyutping: sik1 si4 jin4 man4 fui3 jyu5 zeon1 zeon1 zaap6 wan5 zang1 gwong2 do1 gin3 do1 man4
    explain_cantonese: 以前啲賢人留低嘅金句，好誠懇咁教你做人。呢本書將啲押韻嘅格言收埋一齊，再補充多啲，等你睇得多、聽得多，見識自然廣啲。
    explain_standard: 古代賢人留下的格言，懇切地教導你。這本書把押韻的格言收集起來，再加以增補，讓你多見多聞，增廣見識。
    en_natural: The wise sayings of old earnestly teach you. Gathered here in rhyme and expanded, they help you see and hear more of the world.
    en_literal: Worthy writings of former times instruct you earnestly; gathered in rhyme and expanded, (so that you) see much and hear much.
    context_note: 誨汝諄諄 echoes the Book of Songs (《詩經·大雅·抑》：「誨爾諄諄，聽我藐藐」, "I teach you earnestly, but you listen carelessly"). The book's title, 增廣 ("expanded"), comes from this line.
    reviewed: false

  - id: zgxw-002
    source: [2]
    themes: [diligence-time]
    text_trad: 觀今宜鑑古，無古不成今。
    text_simp: 观今宜鉴古，无古不成今。
    pinyin: guān jīn yí jiàn gǔ wú gǔ bù chéng jīn
    jyutping: gun1 gam1 ji4 gaam3 gu2 mou4 gu2 bat1 sing4 gam1
    explain_cantonese: 想睇清楚今日嘅事，就要攞歷史嚟做鏡；冇咗過去，就唔會有今日。
    explain_standard: 要看清當下，應當以歷史為鏡；沒有過去，就沒有現在。
    en_natural: To understand the present, look to the past; without the past there would be no present.
    en_literal: Observing the present, one should mirror (it in) the ancient; without the ancient, the present is not formed.
    en_equivalent: What's past is prologue.
    context_note: 鑑 was a bronze basin of water used as a mirror, so 鑑古 is "to see yourself in the past". Compare Emperor Taizong of Tang, 「以古為鏡，可以知興替」 ("with history as a mirror, you can understand rise and fall"). Some texts read 知今宜鑑古.
    reviewed: false

  - id: zgxw-003
    source: [3]
    themes: [character-friendship, conduct-patience]
    text_trad: 知己知彼，將心比心。
    text_simp: 知己知彼，将心比心。
    pinyin: zhī jǐ zhī bǐ jiāng xīn bǐ xīn
    jyutping: zi1 gei2 zi1 bei2 zoeng1 sam1 bei2 sam1
    explain_cantonese: 要了解自己，亦要了解人哋；凡事將自己個心放落人哋度諗吓，體諒人哋嘅感受。
    explain_standard: 既要了解自己，也要了解別人；凡事設身處地，用自己的心去體會別人的感受。
    en_natural: Know yourself and know others; judge their feelings by your own.
    en_literal: Know oneself, know the other; take (one's own) heart and compare (it with another's) heart.
    en_equivalent: Put yourself in someone else's shoes.
    context_note: 知己知彼 comes from The Art of War (《孫子兵法·謀攻》：「知彼知己，百戰不殆」), where it is about knowing your enemy. Here it is turned to understanding the people around you.
    reviewed: false

  - id: zgxw-004
    source: [4]
    themes: [character-friendship]
    text_trad: 酒逢知己飲，詩向會人吟。
    text_simp: 酒逢知己饮，诗向会人吟。
    pinyin: jiǔ féng zhī jǐ yǐn shī xiàng huì rén yín
    jyutping: zau2 fung4 zi1 gei2 jam2 si1 hoeng3 wui5 jan4 jam4
    explain_cantonese: 飲酒就要同知己飲，吟詩就要吟俾識欣賞嘅人聽。好嘢要同明白你嘅人分享。
    explain_standard: 喝酒要和知己一起喝，吟詩要吟給懂得欣賞的人聽。美好的東西，要與懂你的人分享。
    en_natural: Drink with a friend who truly knows you; recite poems to those who understand them.
    en_literal: Wine, meeting a true friend, is drunk; poems, toward a person who understands, are chanted.
    context_note: 會人 is "a person who understands", 會 as in 領會. Compare the popular saying 酒逢知己千杯少，話不投機半句多.
    reviewed: false
