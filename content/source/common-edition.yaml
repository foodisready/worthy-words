- n: 1
  text: 昔時賢文，誨汝諄諄，集韻增廣，多見多聞。
- n: 2
  text: 觀今宜鑑古，無古不成今。
  variants:
    - reading: 知今宜鑑古，無古不成今。
      source: Wikisource 2614365 (marked 一作)
- n: 3
  text: 知己知彼，將心比心。
- n: 4
  text: 酒逢知己飲，詩向會人吟。
- n: 5
  text: 相識滿天下，知心能幾人。
- n: 6
  text: 相逢好似初相識，到老終無怨恨心。
- n: 7
  text: 近水知魚性，近山識鳥音。
- n: 8
  text: 易漲易退山溪水，易反易覆小人心。
- n: 9
  text: 運去金成鐵，時來鐵似金，讀書須用意，一字值千金。
- n: 10
  text: 逢人且說三分話，未可全拋一片心。
- n: 11
  text: 有意栽花花不發，無心插柳柳成陰。
  variants:
    - reading: 有意栽花花不發，無心插柳柳成蔭。
      source: Wikisource 2614365
- n: 12
  text: 畫虎畫皮難畫骨，知人知面不知心。
- n: 13
  text: 錢財如糞土，仁義值千金。
- n: 14
  text: 流水下灘非有意，白雲出岫本無心。
- n: 15
  text: 當時若不登高望，誰信東流海洋深。
- n: 16
  text: 路遙知馬力，事久見人心。
  variants:
    - reading: 路遙知馬力，日久見人心。
      source: Wikisource 2614365
- n: 17
  text: 兩人一般心，無錢堪買金，一人一般心，有錢難買針。
- n: 18
  text: 相見易得好，久住難為人。
- n: 19
  text: 馬行無力皆因瘦，人不風流只為貧。
- n: 20
  text: 饒人不是癡漢，癡漢不會饒人。
- n: 21
  text: 是親不是親，非親卻是親。
- n: 22
  text: 美不美，鄉中水，親不親，故鄉人。
- n: 23
  text: 鶯花猶怕春光老，豈可教人枉度春。
- n: 24
  text: 相逢不飲空歸去，洞口桃花也笑人。
- n: 25
  text: 紅粉佳人休使老，風流浪子莫教貧。
- n: 26
  text: 在家不會迎賓客，出外方知少主人。
- n: 27
  text: 黃芩無假，阿魏無真。
- n: 28
  text: 客來主不顧，應恐是癡人。
  variants:
    - reading: 客來主不顧，自是無良賓；良賓主不顧，應恐是癡人。
      source: Wikisource 2614365
- n: 29
  text: 貧居鬧市無人問，富在深山有遠親。
- n: 30
  text: 誰人背後無人說，哪個人前不說人。
- n: 31
  text: 有錢道真語，無錢語不真。
- n: 32
  text: 不信但看筵中酒，杯杯先勸有錢人。
  variants:
    - reading: 不信但看筵中酒，杯杯先敬有錢人。
      source: Wikisource 2614365
- n: 33
  text: 鬧裏有錢，靜處安身。
  variants:
    - reading: 鬧裏掙錢，靜處安身。
      source: Wikisource 2614365
    - reading: 鬧市掙錢，靜處安身。
      source: Wikisource 2614365 (marked 一作)
- n: 34
  text: 來如風雨，去似微塵。
- n: 35
  text: 長江後浪推前浪，世上新人趕舊人。
- n: 36
  text: 近水樓臺先得月，向陽花木早逢春。
- n: 36a
  text: 古人不見今時月，今月曾經照古人。
  note: Restored; missing from Wikisource 1955020 but in Wikisource 2614365 and a modern annotated copy, after 近水樓臺先得月. Echoes Li Bai's 《把酒問月》.
- n: 36b
  text: 先到為君，後到為臣。
  note: Restored; missing from Wikisource 1955020 but in Wikisource 2614365 and a modern annotated copy, before 莫道君行早.
- n: 37
  text: 莫道君行早，更有早行人。
- n: 38
  text: 莫信直中直，須防仁不仁。
- n: 39
  text: 山中有直樹，世上無直人。
- n: 40
  text: 自恨枝無葉，莫怨太陽偏。
- n: 41
  text: 大家都是命，半點不由人。
  variants:
    - reading: 萬般皆是命，半點不由人。
      source: Wikisource 2614365
- n: 42
  text: 一年之計在於春，一日之計在於晨，一家之計在於和，一生之計在於勤。
- n: 43
  text: 責人之心責己，恕己之心恕人。
- n: 44
  text: 守口如瓶，防意如城。
- n: 45
  text: 寧可人負我，切莫我負人。
- n: 46
  text: 再三須慎意，第一莫欺心。
- n: 47
  text: 虎生猶可近，人熟不堪親。
- n: 48
  text: 來說是非者，便是是非人。
- n: 49
  text: 遠水難救近火，遠親不如近鄰。
- n: 50
  text: 有茶有酒多兄弟，急難何曾見一人。
- n: 51
  text: 人情似紙張張薄，世事如棋局局新。
- n: 52
  text: 山中也有千年樹，世上難逢百歲人。
- n: 53
  text: 力微休負重，言輕莫勸人。
- n: 54
  text: 無錢休入眾，遭難莫尋親。
- n: 55
  text: 平生莫作皺眉事，世上應無切齒人。
  variants:
    - reading: 平生不做皺眉事，世上應無切齒人。
      source: Wikisource 2614365
- n: 56
  text: 士者國之寶，儒為席上珍。
  variants:
    - reading: 士乃國之寶，儒為席上珍。
      source: Wikisource 2614365
- n: 57
  text: 若要斷酒法，醒眼看醉人。
- n: 58
  text: 求人須求大丈夫，濟人須濟急時無。
  variants:
    - reading: 求人須求英雄漢，濟人須濟急時無。
      source: Wikisource 2614365 (marked 一作)
- n: 59
  text: 渴時一滴如甘露，醉後添杯不如無。
- n: 60
  text: 久住令人賤，頻來親也疏。
- n: 61
  text: 酒中不語真君子，財上分明大丈夫。
- n: 62
  text: 出家如初，成佛有餘。
- n: 63
  text: 積金千兩，不如明解經書。
- n: 64
  text: 養子不教如養驢，養女不教如養豬。
- n: 65
  text: 有田不耕倉廩虛，有書不讀子孫愚。
- n: 66
  text: 倉廩虛兮歲月乏，子孫愚兮禮義疏。
- n: 67
  text: 聽君一席話，勝讀十年書。
- n: 68
  text: 人不通今古，馬牛如襟裾。
- n: 69
  text: 茫茫四海人無數，哪個男兒是丈夫。
- n: 70
  text: 白酒釀成緣好客，黃金散盡為收書。
  variants:
    - reading: 白酒釀成緣好客，黃金散盡為詩書。
      source: Wikisource 2614365 (marked 一作)
- n: 71
  text: 救人一命，勝造七級浮屠。
- n: 72
  text: 城門失火，殃及池魚。
- n: 73
  text: 庭前生瑞草，好事不如無。
- n: 74
  text: 欲求生富貴，須下死工夫。
- n: 75
  text: 百年成之不足，一旦敗之有餘。
  variants:
    - reading: 百年成之不足，一旦壞之有餘。
      source: Wikisource 2614365 (marked 一作)
- n: 76
  text: 人心似鐵，官法如爐。
- n: 77
  text: 善化不足，惡化有餘。
- n: 78
  text: 水太清則無魚，人至察則無徒。
- n: 79
  text: 知者減半，省者全無。
- n: 80
  text: 在家由父，出嫁從夫。
  variants:
    - reading: 在家由父，出家從夫。
      source: Wikisource 1955020 (before correction)
  note: 出家 ("leave home as a monk or nun") makes no sense here; the line is 出嫁 ("marry"), as in Wikisource 2614365 and the 三從 saying it quotes.
- n: 81
  text: 癡人畏婦，賢女敬夫。
- n: 82
  text: 是非終日有，不聽自然無。
- n: 83
  text: 寧可正而不足，不可邪而有餘。
- n: 84
  text: 寧可信其有，不可信其無。
- n: 85
  text: 竹籬茅舍風光好，道院僧堂終不如。
- n: 86
  text: 命裏有時終須有，命裏無時莫強求。
- n: 87
  text: 道院迎仙客，書堂隱相儒。
- n: 88
  text: 庭栽棲鳳竹，池養化龍魚。
- n: 89
  text: 結交須勝己，似我不如無。
- n: 90
  text: 但看三五日，相見不如初。
- n: 91
  text: 人情似水分高下，世事如雲任卷舒。
- n: 92
  text: 會說說都是，不會說無禮。
- n: 93
  text: 磨刀恨不利，刀利傷人指。
- n: 94
  text: 求財恨不得，財多害自己。
- n: 95
  text: 知足常足，終身不辱。
- n: 96
  text: 知止常止，終身不恥。
- n: 97
  text: 有福傷財，無福傷己。
- n: 98
  text: 差之毫釐，失之千里。
- n: 99
  text: 若登高必自卑，若涉遠必自邇。
- n: 100
  text: 三思而行，再思可矣。
- n: 101
  text: 使口不如自走，求人不如求己。
  variants:
    - reading: 使口不如親為，求人不如求己。
      source: Wikisource 2614365
- n: 102
  text: 小時是兄弟，長大各鄉里。
- n: 103
  text: 妒財莫妒食，怨生莫怨死。
  variants:
    - reading: 嫉財莫妒食，怨生莫怨死。
      source: Wikisource 2614365 (marked 一作)
- n: 104
  text: 人見白頭嗔，我見白頭喜。
- n: 105
  text: 多少少年亡，不到白頭死。
- n: 106
  text: 牆有縫，壁有耳。
- n: 107
  text: 好事不出門，惡事傳千里。
  variants:
    - reading: 好事不出門，壞事傳千里。
      source: Wikisource 2614365 (marked 一作)
- n: 108
  text: 賊是小人，知過君子。
- n: 109
  text: 君子固窮，小人窮斯濫也。
  variants:
    - reading: 君子固窮，小人窮斯濫矣。
      source: Wikisource 2614365 (marked 一作)
- n: 110
  text: 貧窮自在，富貴多憂。
- n: 111
  text: 不以我為德，反以我為仇。
- n: 112
  text: 寧向直中取，不可曲中求。
- n: 113
  text: 人無遠慮，必有近憂。
- n: 114
  text: 知我者謂我心憂，不知我者謂我何求。
- n: 115
  text: 晴天不肯去，只待雨淋頭。
  variants:
    - reading: 晴天不肯去，直待雨淋頭。
      source: Wikisource 2614365 (marked 一作)
- n: 116
  text: 成事莫說，覆水難收。
- n: 117
  text: 是非只為多開口，煩惱皆因強出頭。
- n: 118
  text: 忍得一時之氣，免得百日之憂。
- n: 119
  text: 近來學得烏龜法，得縮頭時且縮頭。
- n: 120
  text: 懼法朝朝樂，欺公日日憂。
  variants:
    - reading: 懼法朝朝樂，欺心日日憂。
      source: Wikisource 2614365 (marked 一作)
- n: 121
  text: 人生一世，草生一春。
- n: 122
  text: 黑髮不知勤學早，白首方悔讀書遲。
- n: 123
  text: 月到十五光明少，人到中年萬事休。
  variants:
    - reading: 月過十五光明少，人到中年萬事休。
      source: Wikisource 2614365
- n: 124
  text: 兒孫自有兒孫福，莫為兒孫作馬牛。
- n: 125
  text: 人生不滿百，常懷千歲憂。
- n: 126
  text: 今朝有酒今朝醉，明日愁來明日憂。
- n: 127
  text: 路逢險處難迴避，事到頭來不自由。
- n: 128
  text: 藥能醫假病，酒不解真愁。
- n: 129
  text: 人貧不語，水平不流。
- n: 130
  text: 一家有女百家求，一馬不行百馬憂。
- n: 131
  text: 有花方酌酒，無月不登樓。
- n: 132
  text: 三杯通大道，一醉解千愁。
- n: 133
  text: 深山畢竟藏猛虎，大海終須納細流。
- n: 134
  text: 惜花須檢點，愛月不梳頭。
- n: 135
  text: 大抵選他肌骨好，不擦紅粉也風流。
- n: 136
  text: 受恩深處宜先退，得意濃時便可休。
- n: 137
  text: 莫待是非來入耳，從前恩愛反為仇。
- n: 138
  text: 留得五湖明月在，不愁無處下金鉤。
- n: 139
  text: 休別有魚處，莫戀淺灘頭。
- n: 140
  text: 去時終須去，再三留不住。
- n: 141
  text: 忍一句，息一怒，饒一着，退一步。
- n: 142
  text: 三十不豪，四十不富，五十將來尋死路。
  variants:
    - reading: 三十不豪，四十不富，五十將衰尋子助。
      source: Wikisource 2614365 (marked 一作)
- n: 143
  text: 生不論魂，死不認屍。
- n: 144
  text: 父母恩深終有別，夫妻義重也分離。
- n: 145
  text: 人生似鳥同林宿，大限來時各自飛。
- n: 146
  text: 人善被人欺，馬善被人騎。
- n: 147
  text: 人無橫財不富，馬無野草不肥。
  variants:
    - reading: 人無橫財不富，馬無夜草不肥。
      source: Wikisource 2614365 (marked 一作)
- n: 148
  text: 人惡人怕天不怕，人善人欺天不欺。
- n: 149
  text: 善惡到頭終有報，只爭來早與來遲。
  variants:
    - reading: 善惡到頭終有報，只盻來早與來遲。
      source: Wikisource 2614365 (marked 一作)
- n: 150
  text: 黃河尚有澄清日，豈可人無得運時。
- n: 151
  text: 得寵思辱，安居慮危。
- n: 152
  text: 唸唸有如臨敵日，心心常似過橋時。
- n: 153
  text: 英雄行險道，富貴似花枝。
- n: 154
  text: 人情莫道春光好，只怕秋來有冷時。
- n: 155
  text: 送君千里，終須一別。
- n: 156
  text: 但將冷眼看螃蟹，看你橫行到幾時。
  variants:
    - reading: 但將冷眼觀螃蟹，看你橫行到幾時。
      source: Wikisource 2614365 (marked 一作)
- n: 157
  text: 見事莫說，問事不知。
- n: 158
  text: 閒事休管，無事早歸。
- n: 159
  text: 假緞染就真紅色，也被旁人說是非。
- n: 160
  text: 善事可作，惡事莫為。
- n: 161
  text: 許人一物，千金不移。
- n: 162
  text: 龍生龍子，虎生豹兒。
- n: 163
  text: 龍游淺水遭蝦戲，虎落平陽被犬欺。
- n: 164
  text: 一舉首登龍虎榜，十年身到鳳凰池。
- n: 165
  text: 十年窗下無人問，一舉成名天下知。
  variants:
    - reading: 十年寒窗無人問，一舉成名天下知。
      source: Wikisource 2614365 (marked 一作)
- n: 166
  text: 酒債尋常行處有，人生七十古來稀。
- n: 167
  text: 養兒待老，積穀防饑。
  variants:
    - reading: 養兒待老，積穀防飢。
      source: Wikisource 2614365
- n: 168
  text: 雞豚狗彘之畜，無失其時。
- n: 169
  text: 數家之口，可以無飢矣。
- n: 170
  text: 常將有日思無日，莫把無時當有時。
- n: 171
  text: 時來風送滕王閣，運去雷轟薦福碑。
- n: 172
  text: 入門休問榮枯事，觀看容顏便得知。
- n: 173
  text: 官清書吏瘦，神靈廟祝肥。
- n: 174
  text: 息卻雷霆之怒，罷卻虎狼之威。
- n: 175
  text: 饒人算人之本，輸人算人之機。
- n: 176
  text: 好言難得，惡語易施。
- n: 177
  text: 一言既出，駟馬難追。
- n: 178
  text: 道吾好者是吾賊，道吾惡者是吾師。
- n: 179
  text: 路逢俠客須呈劍，不是才人莫獻詩。
- n: 180
  text: 三人同行，必有我師焉，擇其善者而從之，其不善者而改之。
- n: 181
  text: 少壯不努力，老大徒傷悲。
  variants:
    - reading: 少壯不努力，老大徒悲傷。
      source: Wikisource 1955020 (before correction)
  note: Quotes the Han ballad 《長歌行》, which ends 老大徒傷悲; 悲傷 is a common misquotation.
- n: 182
  text: 人有善願，天必佑之。
- n: 183
  text: 莫飲卯時酒，昏昏醉到酉。
- n: 184
  text: 莫罵酉時妻，一夜受孤淒。
- n: 185
  text: 種麻得麻，種豆得豆。
- n: 186
  text: 天眼恢恢，疏而不漏。
- n: 187
  text: 見官莫向前，做客莫在後。
- n: 188
  text: 寧添一斗，莫添一口。
- n: 189
  text: 螳螂捕蟬，豈知黃雀在後。
- n: 190
  text: 不求金玉重重貴，但願兒孫個個賢。
- n: 191
  text: 一日夫妻，百世姻緣。
- n: 192
  text: 百世修來同船渡，千世修來共枕眠。
- n: 193
  text: 殺人一萬，自損三千。
- n: 194
  text: 傷人一語，利如刀割。
- n: 195
  text: 枯木逢春猶再發，人無兩度再少年。
- n: 196
  text: 未晚先投宿，雞鳴早看天。
- n: 197
  text: 將相胸前堪走馬，公侯肚裏好撐船。
  variants:
    - reading: 將相胸前堪走馬，公候肚裏好撐船。
      source: Wikisource 1955020 (before correction)
    - reading: 將相頂頭堪走馬，公侯肚裏好撐船。
      source: Wikisource 2614365 (marked 一作)
    - reading: 將相胸前堪走馬，公侯肚內好撐船。
      source: Wikisource 2614365 (marked 一作)
  note: 公候 is a typo for 公侯 ("dukes and marquises"), matching 將相 in the first half.
- n: 198
  text: 富人思來年，窮人思眼前。
  variants:
    - reading: 富人思來年，窮人想眼前。
      source: Wikisource 2614365
- n: 199
  text: 世上若要人情好，賒去物件莫取錢。
  variants:
    - reading: 世上若要人情好，賒去物品莫取錢。
      source: Wikisource 2614365 (marked 一作)
- n: 200
  text: 死生有命，富貴在天。
- n: 201
  text: 擊石原有火，不擊乃無煙。
- n: 202
  text: 為學始知道，不學亦徒然。
- n: 203
  text: 莫笑他人老，終須還到老。
- n: 204
  text: 但能依本分，終須無煩惱。
- n: 205
  text: 君子愛財，取之有道。
- n: 206
  text: 貞婦愛色，納之以禮。
- n: 207
  text: 善有善報，惡有惡報。
- n: 208
  text: 不是不報，日子不到。
  variants:
    - reading: 不是不報，時候不到。
      source: Wikisource 2614365 (marked 一作)
- n: 209
  text: 人而無信，不知其可也。
- n: 210
  text: 一人道好，千人傳實。
  variants:
    - reading: 一人道虛，千人傳實。
      source: Wikisource 2614365
- n: 211
  text: 凡事要好，須問三老。
- n: 212
  text: 若爭小可，便失大道。
- n: 213
  text: 年年防饑，夜夜防盜。
- n: 214
  text: 學者如禾如稻，不學者如蒿如草。
- n: 215
  text: 遇飲酒時須飲酒，得高歌處且高歌。
  variants:
    - reading: 遇防醉時須飲酒，得高歌處且高歌。
      source: Wikisource 2614365 (marked 一作)
- n: 216
  text: 因風吹火，用力不多。
- n: 217
  text: 不因漁父引，怎得見波濤。
- n: 218
  text: 無求到處人情好，不飲從他酒價高。
- n: 219
  text: 知事少時煩惱少，識人多處是非多。
- n: 220
  text: 入山不怕傷人虎，只怕人情兩面刀。
- n: 221
  text: 強中更有強中手，惡人須用惡人磨。
- n: 222
  text: 會使不在家豪富，風流不用著衣多。
- n: 223
  text: 光陰似箭，日月如梭。
- n: 224
  text: 天時不如地利，地利不如人和。
- n: 225
  text: 黃金未為貴，安樂值錢多。
- n: 226
  text: 世上萬般皆下品，思量唯有讀書高。
- n: 227
  text: 世間好語書說盡，天下名山僧佔多。
- n: 228
  text: 為善最樂，為惡難逃。
  variants:
    - reading: 為善最樂，作惡難逃。
      source: Wikisource 2614365
- n: 229
  text: 羊有跪乳之恩，鴉有反哺之義。
- n: 230
  text: 你急他未急，人閒心不閒。
- n: 231
  text: 隱惡揚善，執其兩端。
- n: 232
  text: 妻賢夫禍少，子孝父心寬。
- n: 233
  text: 既墜釜甑，反顧無益。
- n: 234
  text: 翻覆之水，收之實難。
- n: 235
  text: 人生知足何時足，人老偷閒且是閒。
- n: 236
  text: 但有綠楊堪繫馬，處處有路透長安。
  variants:
    - reading: 但有綠楊堪系馬，處處有路透長安。
      source: Wikisource 1955020 (before correction)
    - reading: 但有綠楊堪繫馬，處處有路通長安。
      source: Wikisource 2614365
  note: 系 comes from converting simplified 系 back to traditional; tying a horse is 繫馬. 透長安 is kept as the base reading (also in a modern annotated copy).
- n: 237
  text: 見者易，學者難。
- n: 238
  text: 莫將容易得，便作等閒看。
- n: 239
  text: 用心計較般般錯，退步思量事事難。
- n: 240
  text: 道路各別，養家一般。
- n: 241
  text: 從儉入奢易，從奢入儉難。
- n: 242
  text: 知音說與知音聽，不是知音莫與彈。
- n: 243
  text: 點石化為金，人心猶未足。
- n: 244
  text: 信了肚，賣了屋。
  variants:
    - reading: 信了賭，賣了屋。
      source: Wikisource 2614365
- n: 245
  text: 他人觀花，不涉你目。
- n: 246
  text: 他人碌碌，不涉你足。
- n: 247
  text: 誰人不愛子孫賢，誰人不愛千鍾粟。
  variants:
    - reading: 誰人不愛子孫賢，誰人不愛千鐘粟。
      source: Wikisource 1955020 (before correction)
  note: Simplified 钟 was converted to 鐘 ("bell"); 千鍾粟 ("a thousand measures of grain") uses 鍾.
- n: 248
  text: 奈五行，不是這般題目。
  variants:
    - reading: 莫把真心空計較，五行不是這題目。
      source: Wikisource 1955020 (before correction)
  note: The base text joins the first half of the next line to the end of this one. Wikisource 2614365 and a modern annotated copy both read 誰人不愛千鍾粟，奈五行，不是這般題目。莫把真心空計較，兒孫自有兒孫福。
- n: 248a
  text: 莫把真心空計較，兒孫自有兒孫福。
  note: Restored; Wikisource 1955020 merged its first half into line 248. In Wikisource 2614365 and a modern annotated copy.
- n: 249
  text: 與人不和，勸人養鵝。
- n: 250
  text: 與人不睦，勸人架屋。
- n: 251
  text: 但行好事，莫問前程。
- n: 252
  text: 河狹水急，人急計生。
  variants:
    - reading: 河狹水激，人急計生。
      source: Wikisource 2614365
- n: 253
  text: 明知山有虎，莫向虎山行。
- n: 254
  text: 路不行不到，事不為不成。
  variants:
    - reading: 路不鏟不平，事不為不成。
      source: Wikisource 2614365 (marked 一作)
- n: 255
  text: 人不勸不善，鐘不打不鳴。
- n: 256
  text: 無錢方斷酒，臨老始看經。
- n: 257
  text: 點塔七層，不如暗處一燈。
- n: 258
  text: 萬事勸人休瞞昧，舉頭三尺有神明。
- n: 259
  text: 但存方寸土，留與子孫耕。
- n: 260
  text: 滅卻心頭火，剔起佛前燈。
- n: 261
  text: 惺惺常不足，懵懵作公卿。
  variants:
    - reading: 惺惺多不足，懵懵作公卿。
      source: Wikisource 2614365 (marked 一作)
- n: 262
  text: 眾星朗朗，不如孤月獨明。
- n: 263
  text: 兄弟相害，不如自生。
- n: 264
  text: 合理可作，小利莫爭。
- n: 265
  text: 牡丹花好空入目，棗花雖小結實成。
- n: 266
  text: 欺老莫欺小，欺人心不明。
- n: 267
  text: 隨分耕鋤收地利，他時飽滿謝蒼天。
- n: 268
  text: 得忍且忍，得耐且耐。
- n: 269
  text: 不忍不耐，小事成大。
- n: 270
  text: 相論逞英雄，家計漸漸退。
- n: 271
  text: 賢婦令夫貴，惡婦令夫敗。
- n: 272
  text: 一人有慶，兆民咸賴。
- n: 273
  text: 人老心未老，人窮志莫窮。
- n: 274
  text: 人無千日好，花無百日紅。
- n: 275
  text: 殺人可恕，情理難容。
- n: 276
  text: 乍富不知新受用，乍貧難改舊家風。
- n: 277
  text: 座上客常滿，樽中酒不空。
  variants:
    - reading: 座上客常滿，杯中酒不空。
      source: Wikisource 2614365 (marked 一作)
- n: 278
  text: 屋漏更遭連夜雨，行船又遇打頭風。
  variants:
    - reading: 屋漏更遭連年雨，行船又遇打頭風。
      source: Wikisource 1955020 (before correction)
  note: 連夜雨 ("rain night after night") is the reading of Wikisource 2614365, a modern annotated copy, and the saying as it is known; 連年 breaks the image.
- n: 279
  text: 筍因落籜方成竹，魚為奔波始化龍。
- n: 280
  text: 記得少年騎竹馬，看看又是白頭翁。
- n: 281
  text: 禮義生於富足，盜賊出於貧窮。
- n: 282
  text: 天上眾星皆拱北，世間無水不朝東。
- n: 283
  text: 君子安貧，達人知命。
- n: 284
  text: 忠言逆耳利於行，良藥苦口利於病。
- n: 285
  text: 順天者存，逆天者亡。
- n: 286
  text: 人為財死，鳥為食亡。
- n: 287
  text: 夫妻相合好，琴瑟與笙簧。
- n: 288
  text: 有兒貧不久，無子富不長。
- n: 289
  text: 善必壽老，惡必早亡。
- n: 290
  text: 爽口食多偏作藥，快心事過恐生殃。
- n: 291
  text: 富貴定要安本分，貧窮不必枉思量。
- n: 292
  text: 畫水無風空作浪，繡花雖好不聞香。
- n: 293
  text: 貪他一斗米，失卻半年糧。
- n: 294
  text: 爭他一腳豚，反失一肘羊。
- n: 295
  text: 龍歸晚洞雲猶濕，麝過春山草木香。
- n: 296
  text: 平生只會量人短，何不回頭把自量。
- n: 297
  text: 見善如不及，見惡如探湯。
- n: 298
  text: 人貧志短，馬瘦毛長。
- n: 299
  text: 自家心裏急，他人未知忙。
- n: 300
  text: 貧無達士將金贈，病有高人說藥方。
- n: 301
  text: 觸來莫與說，事過心清涼。
- n: 302
  text: 秋至滿山多秀色，春來無處不花香。
- n: 303
  text: 凡人不可貌相，海水不可斗量。
- n: 304
  text: 清清之水，為土所妨。
- n: 305
  text: 濟濟之士，為酒所傷。
- n: 306
  text: 蒿草之下，或有蘭香。
- n: 307
  text: 茅茨之屋，或有侯王。
- n: 308
  text: 無限朱門生餓殍，幾多白屋出卿相。
  variants:
    - reading: 無限朱門生餓殍，幾多白屋出公卿。
      source: Wikisource 2614365
- n: 309
  text: 醉後乾坤大，壺中日月長。
  variants:
    - reading: 醉裏乾坤大，壺中日月長。
      source: Wikisource 2614365
- n: 310
  text: 萬事皆已定，浮生空自忙。
  variants:
    - reading: 萬事皆已定，浮生空白茫。
      source: Wikisource 1955020 (before correction)
    - reading: 萬事前身定，浮生空自忙。
      source: Wikisource 2614365
  note: 空白茫 is a garbled 空自忙 ("busy oneself in vain"), the reading of a modern annotated copy and, as 浮生空自忙, of Wikisource 2614365.
- n: 311
  text: 千里送毫毛，禮輕仁義重。
- n: 312
  text: 一人傳虛，百人傳實。
- n: 313
  text: 世事明如鏡，前程暗似漆。
- n: 314
  text: 光陰黃金難買，一世如駒過隙。
- n: 315
  text: 良田萬頃，日食一升。
- n: 316
  text: 大廈千間，夜眠八尺。
- n: 317
  text: 千經萬典，孝義為先。
- n: 318
  text: 一字入公門，九牛拖不出。
  variants:
    - reading: 一字入公門，九牛拔不出。
      source: Wikisource 2614365
- n: 319
  text: 衙門八字開，有理無錢莫進來。
  variants:
    - reading: 八字衙門向南開，有理無錢莫進來。
      source: Wikisource 2614365
- n: 320
  text: 富從升合起，貧因不算來。
- n: 321
  text: 家中無才子，官從何處來。
- n: 322
  text: 萬事不由人計較，一生都是命安排。
- n: 323
  text: 急行慢行，前程只有多少路。
- n: 324
  text: 人間私語，天聞若雷。
- n: 325
  text: 暗室虧心，神目如電。
- n: 326
  text: 一毫之惡，勸人莫作。
- n: 327
  text: 一毫之善，與人方便。
- n: 328
  text: 欺人是禍，饒人是福。
- n: 329
  text: 天眼恢恢，報應甚速。
- n: 330
  text: 聖賢言語，神欽鬼伏。
  variants:
    - reading: 聖賢言語，神欽鬼服。
      source: Wikisource 2614365 (marked 一作)
- n: 331
  text: 人各有心，心各有見。
- n: 332
  text: 口說不如身逢，耳聞不如目見。
- n: 333
  text: 養軍千日，用在一朝。
- n: 334
  text: 國清才子貴，家富小兒驕。
- n: 335
  text: 利刀割體痕易合，惡語傷人恨不消。
- n: 336
  text: 公道世間唯白髮，貴人頭上不曾饒。
- n: 337
  text: 有錢堪出眾，無衣懶出門。
- n: 338
  text: 為官須作相，及第必爭先。
- n: 339
  text: 苗從地發，樹向枝分。
- n: 340
  text: 父子和而家不退，兄弟和而家不分。
- n: 341
  text: 官有正條，民有和約。
- n: 342
  text: 閒時不燒香，急時抱佛腳。
- n: 343
  text: 幸生太平無事日，恐逢年老不多時。
- n: 344
  text: 國亂思良將，家貧思賢妻。
- n: 345
  text: 池塘積水須防旱，田地勤耕足養家。
- n: 346
  text: 根深不怕風搖動，樹正無愁月影斜。
- n: 347
  text: 奉勸君子，各宜守己。
- n: 348
  text: 只此呈示，萬無一失。
