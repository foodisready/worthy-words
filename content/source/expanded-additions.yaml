- n: 1
  text: 貧賤之交不可忘，糟糠之妻不下堂。
- n: 2
  text: 若要人不知，除非己莫為。
- n: 3
  text: 為人不做虧心事，半夜敲門心不驚。
- n: 4
  text: 為人莫做千年計，三十河東四十西。
- n: 5
  text: 一寸光陰一寸金，寸金難買寸光陰。
- n: 6
  text: 當家纔知鹽米貴，養子方知父母恩。
- n: 7
  text: 樹欲靜而風不止，子欲養而親不待。
- n: 8
  text: 欲昌和順須為善，要振家聲在讀書。
- n: 9
  text: 和得鄰里好，猶如拾片寶。
- n: 10
  text: 大家做事尋常，小家做事慌張。
- n: 11
  text: 大家禮義教子弟，小家兇惡訓兒郎。
- n: 12
  text: 萬惡淫為首，百善孝當先。
- n: 13
  text: 家中不和鄰里欺，鄰里不和說是非。
- n: 14
  text: 學者是好，不學不好。
- n: 15
  text: 孝順還生孝順子，忤逆還生忤逆兒。
- n: 16
  text: 不信但看檐前水，點點滴滴舊池窩。
- n: 17
  text: 厭靜還思喧，嫌喧又憶山。
- n: 18
  text: 自從心定後，無處不安然。
- n: 19
  text: 書到用時方恨少，事非經過不知難。
- n: 20
  text: 天下無不是的父母，世上最難得者兄弟。
- n: 21
  text: 堂上二老是活佛，何用靈山朝世尊。
- n: 22
  text: 黃蜂一口針，橘子兩邊分。
- n: 23
  text: 世間痛恨事，最毒淫婦心。
- n: 24
  text: 士為知己者死，女為悅己者容。
- n: 25
  text: 色即是空，空即是色。
- n: 26
  text: 良藥苦口利於病，忠言逆耳利於行。
- n: 27
  text: 有緣千里來相會，無緣對面不相逢。
- n: 28
  text: 有福者昌，無福者亡。
- n: 29
  text: 紅粉易妝嬌態女，無錢難作好兒郎。
- n: 30
  text: 拂石坐來春衫冷，踏花歸去馬蹄香。
- n: 31
  text: 叫月子規喉舌冷，宿花蝴蝶夢魂香。
- n: 32
  text: 一言不中，千言不用。
- n: 33
  text: 萬金良藥，不如無疾。
- n: 34
  text: 千里送鵝毛，禮輕情義重。
- n: 35
  text: 君子懷刑，小人懷惠。
- n: 36
  text: 架上碗兒輪流轉，媳婦自有做婆時。
- n: 37
  text: 天上人間，方便第一。
- n: 38
  text: 欲求天下事，須用世間財。
- n: 39
  text: 近河不得枉使水，近山不得枉燒柴。
- n: 40
  text: 慈不掌兵，義不掌財。
- n: 41
  text: 一夫當關，萬夫莫開。
- n: 42
  text: 白雲本是無心物，卻被清風引出來。
- n: 43
  text: 命中只有如許財，絲毫不可有閃失。
- n: 44
  text: 見人富貴生歡喜，莫把心頭似火燒。
- n: 45
  text: 宅裏燃火，煙氣成雲。
- n: 46
  text: 以直報怨，知恩報恩。
- n: 47
  text: 紅顏今日雖欺我，白髮他時不放君。
- n: 48
  text: 一片雲間不相識，三千里外卻逢君。
- n: 49
  text: 爭得貓兒，失卻牛腳。
- n: 50
  text: 愚者千慮，必有一得，智者千慮，必有一失。
- n: 51
  text: 始吾於人也，聽其言而信其行。
- n: 52
  text: 今吾於人也，聽其言而觀其行。
- n: 53
  text: 哪個梳頭無亂髮，情人眼裏出西施。
- n: 54
  text: 珠沉淵而川媚，玉韞石而山輝。
- n: 55
  text: 夕陽無限好，只恐不多時。
- n: 56
  text: 久旱逢甘霖，他鄉遇故知；洞房花燭夜，金榜題名時。
- n: 57
  text: 惜花春起早，愛月夜眠遲。
- n: 58
  text: 掬水月在手，弄花香滿衣。
- n: 59
  text: 桃紅李白薔薇紫，問著東君總不知。
- n: 60
  text: 教子教孫須教義，栽桑栽柘少栽花。
- n: 61
  text: 休念故鄉生處好，受恩深處便為家。
- n: 62
  text: 學在一人之下，用在萬人之上。
- n: 63
  text: 一日為師，終生為父。
- n: 64
  text: 忘恩負義，禽獸之徒。
- n: 65
  text: 勸君莫將油炒菜，留與兒孫夜讀書。
- n: 66
  text: 書中自有千鍾粟，書中自有顏如玉。
- n: 67
  text: 莫怨天來莫怨人，五行八字命生成。
- n: 68
  text: 莫怨自己窮，窮要窮得乾凈；莫羨他人富，富要富得清高。
- n: 69
  text: 別人騎馬我騎驢，仔細思量我不如，
- n: 70
  text: 待我回頭看，還有挑腳漢。
- n: 71
  text: 路上有飢人，家中有賸飯。
- n: 72
  text: 積德與兒孫，要廣行方便。
- n: 73
  text: 作善鬼神欽，作惡遭天遣。
- n: 74
  text: 積錢積穀不如積德，買田買地不如買書。
- n: 75
  text: 一日春工十日糧，十日春工半年糧。
- n: 76
  text: 疏懶人沒喫，勤儉糧滿倉。
- n: 77
  text: 人親財不親，財利要分清。
- n: 78
  text: 十分伶俐使七分，常留三分與兒孫，
- n: 79
  text: 若要十分都使盡，遠在兒孫近在身。
- n: 80
  text: 君子樂得做君子，小人枉自做小人。
- n: 81
  text: 好學者則庶民之子為公卿，不好學者則公卿之子為庶民。
- n: 82
  text: 惜錢莫教子，護短莫從師。
- n: 83
  text: 記得舊文章，便是新舉子。
- n: 84
  text: 人在家中坐，禍從天上落。
- n: 85
  text: 但求心無愧，不怕有後災。
- n: 86
  text: 只有和氣去迎人，哪有相打得太平。
- n: 87
  text: 忠厚自有忠厚報，豪強一定受官刑。
- n: 88
  text: 人到公門正好修，留些陰德在後頭。
- n: 89
  text: 為人何必爭高下，一旦無命萬事休。
- n: 90
  text: 山高不算高，人心比天高。
- n: 91
  text: 白水變酒賣，還嫌豬無糟。
- n: 92
  text: 貧寒休要怨，寶貴不須驕。
- n: 93
  text: 善惡隨人作，禍福自己招。
