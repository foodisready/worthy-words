- n: 1
  text: 前人俗語，言淺理深。
- n: 2
  text: 補遺增廣，集成書文。
- n: 3
  text: 世上無難事，只怕不專心。
- n: 4
  text: 成人不自在，自在不成人；
- n: 5
  text: 金憑火煉方知色，與人交財便知心。
- n: 6
  text: 乞丐無糧，懶惰而成。
- n: 7
  text: 勤儉為無價之寶，節糧乃眾妙之門。
- n: 8
  text: 省事儉用，免得求人。
- n: 9
  text: 量大禍不在，機深禍亦深。
- n: 10
  text: 善為至寶深深用，心作良田世世耕。
- n: 11
  text: 群居防口，獨坐防心。
- n: 12
  text: 體無病為富貴，身平安莫怨貧。
- n: 13
  text: 敗家子弟揮金如土，貧家子弟積土成金。
- n: 14
  text: 富貴非關天地，禍福不是鬼神。
- n: 15
  text: 安分貧一時，本分終不貧。
- n: 16
  text: 不拜父母拜乾親，弟兄不和結外人。
- n: 17
  text: 人過留名，鴈過留聲。
- n: 18
  text: 擇子莫擇父，擇親莫擇鄰。
- n: 19
  text: 愛妻之心是主，愛子之心是親。
- n: 20
  text: 事從根起，藕葉連心。
- n: 21
  text: 禍與福同門，利與害同城。
- n: 22
  text: 清酒紅人臉，財帛動人心！
- n: 23
  text: 寧可葷口念佛，不可素口駡人。
- n: 24
  text: 有錢能說話，無錢話不靈。
- n: 25
  text: 豈能盡如人意？但求不愧吾心。
- n: 26
  text: 不說自己井繩短，反說他人箍井深。
- n: 27
  text: 恩愛多生病，無錢便覺貧。
- n: 28
  text: 只學斟酒意，莫學下棋心。
- n: 29
  text: 孝莫假意，轉眼便為人父母。
- n: 30
  text: 善休望報，回頭只看汝兒孫！
- n: 31
  text: 口開神氣散，舌出是非生！
- n: 32
  text: 彈琴費指甲，說話費精神。
- n: 33
  text: 千貫買田，萬貫結鄰。
- n: 34
  text: 人言未必猶盡，聽話只聽三分。
- n: 35
  text: 隔壁豈無耳，窗外豈無人？
- n: 36
  text: 財可養生須注意，事不關己不勞心。
- n: 37
  text: 酒不護賢，色不護病；
- n: 38
  text: 財不護親，氣不護命！
- n: 39
  text: 一日不可無常業，安閑便易起邪心！
- n: 40
  text: 炎涼世態，富貴更甚於貧賤；
- n: 41
  text: 嫉妒人心，骨肉更甚於外人！
- n: 42
  text: 瓜熟蔕落，水到渠成。
- n: 43
  text: 人情送匹馬，買賣不饒針！
- n: 44
  text: 過頭飯好喫，過頭話難聽！
- n: 45
  text: 事多累了自己，田多養了眾人。
- n: 46
  text: 怕事忍事不生事自然無事；
- n: 47
  text: 平心靜心不欺心何等放心！
- n: 48
  text: 天子至尊不過於理，在理良心天下通行。
- n: 49
  text: 好話不在多說，有理不在高聲！
- n: 50
  text: 一朝權在手，便把令來行。
- n: 51
  text: 甘草味甜人可食，巧言妄語不可聽。
- n: 52
  text: 當塲不論，過後枉然。
- n: 53
  text: 貧莫與富鬬，富莫與官爭！
- n: 54
  text: 官清難逃猾吏手，衙門少有念佛人！
- n: 55
  text: 家有千口，主事一人。
- n: 56
  text: 父子竭力山成玉，弟兄同心土變金。
- n: 57
  text: 當事者迷，旁觀者清。
- n: 58
  text: 怪人不知理，知理不怪人。
- n: 59
  text: 未富先富終不富，未貧先貧終不貧。
- n: 60
  text: 少當少取，少輸當贏！
- n: 61
  text: 飽暖思淫慾，飢寒起盜心！
- n: 62
  text: 蚊蟲遭扇打，只因嘴傷人！
- n: 63
  text: 慾多傷神，財多累心！
- n: 64
  text: 布衣得暖真為福，千金平安即是春。
- n: 65
  text: 家貧出孝子，國亂顯忠臣！
- n: 66
  text: 寧做太平犬，莫做離亂人！
- n: 67
  text: 人有幾等，官有幾品。
- n: 68
  text: 理不衞親，法不為民。
- n: 69
  text: 自重者然後人重，人輕者便是自輕。
- n: 70
  text: 自身不謹，擾亂四鄰。
- n: 71
  text: 快意事過非快意，自古敗名因敗事。
- n: 72
  text: 傷身事莫做，傷心話莫說。
- n: 73
  text: 小人肥口，君子肥身。
- n: 74
  text: 地不生無名之輩，天不生無路之人。
- n: 75
  text: 一苗露水一苗草，一朝天子一朝臣。
- n: 76
  text: 讀未見書如逢良友，見已讀書如逢故人。
- n: 77
  text: 福滿須防有禍，凶多料必無爭。
- n: 78
  text: 不怕三十而死，只怕死後無名。
- n: 79
  text: 但知江湖者，都是薄命人。
- n: 80
  text: 不怕方中打死人，只知方中無好人。
- n: 81
  text: 說長說短，寧說人長莫說短；
- n: 82
  text: 施恩施怨，寧施人恩莫施怨。
- n: 83
  text: 育林養虎，虎大傷人。
- n: 84
  text: 冤家抱頭死，事要解交人。
- n: 85
  text: 卷簾歸乳燕，開扇出蒼蠅。
- n: 86
  text: 愛鼠常留飯，憐蛾燈罩紗。
- n: 87
  text: 人命在天，物命在人。
- n: 88
  text: 奸不通父母，賊不通地鄰。
- n: 89
  text: 盜賊多出賭博，人命常出奸情。
- n: 90
  text: 治國信讒必殺忠臣，治家信讒必疏其親。
- n: 91
  text: 治國不用佞臣，治家不用佞婦。
- n: 92
  text: 好臣一國之寶，好婦一家之珍。
- n: 93
  text: 穩的不滾，滾的不穩。
- n: 94
  text: 兒不嫌母醜，狗不嫌家貧。
- n: 95
  text: 君子千錢不計較，小人一錢惱人心。
- n: 96
  text: 人前顯貴，鬧裏奪爭。
- n: 97
  text: 要知江湖深，一個不做聲。
- n: 98
  text: 知止自當出妄想，安貧須是禁奢心。
- n: 99
  text: 初入行業，三年事成；
- n: 100
  text: 初喫饅頭，三年口生。
- n: 101
  text: 家無生活計，坐喫如山崩。
- n: 102
  text: 家有良田萬頃，不如薄藝在身；
- n: 103
  text: 藝多不養家，食多嚼不贏。
- n: 104
  text: 命中只有八合米，走遍天下不滿升。
- n: 105
  text: 使心用心，反害自身。
- n: 106
  text: 國家無空地，世上無閑人。
- n: 107
  text: 妙藥難醫怨逆病，混財不富窮命人。
- n: 108
  text: 耽誤一年春，十年補不清；
- n: 109
  text: 人能處處能，草能處處生。
- n: 110
  text: 會打三班鼓，也要幾個人。
- n: 111
  text: 人不走不親，水不打不渾。
- n: 112
  text: 三貧三富不到老，十年興敗多少人！
- n: 113
  text: 買貨買得真，折本折得輕；
- n: 114
  text: 不怕問到，只怕倒問。
- n: 115
  text: 人強不如貨強，價高不如口便。
- n: 116
  text: 會買買怕人，會賣賣怕人。
- n: 117
  text: 隻隻船上有梢公，天子足下有貧親。
- n: 118
  text: 既知莫望，不知莫向。
- n: 119
  text: 在一行，練一行。
- n: 120
  text: 窮莫失志，富莫癲狂。
- n: 121
  text: 天欲令其滅亡，必先讓其瘋狂。
- n: 122
  text: 梢長人膽大，梢短人心慌。
- n: 123
  text: 隔行莫貪利，久煉必成鋼。
- n: 124
  text: 瓶花雖好艷，相看不耐長。
- n: 125
  text: 早起三光，遲起三慌。
- n: 126
  text: 未來休指望，過去莫思量；
- n: 127
  text: 時來遇好友，病去遇良方。
- n: 128
  text: 布得春風有夏雨，哈得秋風大家涼。
- n: 129
  text: 晴帶雨傘，飽帶飢糧。
- n: 130
  text: 滿壺全不響，半壺響叮當。
- n: 131
  text: 久利之事莫為，眾爭之地莫往。
- n: 132
  text: 老醫迷舊疾，朽藥誤良方；
- n: 133
  text: 該在水中死，不在岸上亡。
- n: 134
  text: 捨財不如少取，施藥不如傳方。
- n: 135
  text: 倒了城牆醜了縣官，打了梅香醜了姑娘。
- n: 136
  text: 燕子不進愁門，耗子不鑽空倉。
- n: 137
  text: 蒼蠅不叮無縫蛋，謡言不找謹慎人。
- n: 138
  text: 一人捨死，萬人難當。
- n: 139
  text: 人爭一口氣，佛爭一炷香。
- n: 140
  text: 門為小人而設，鎖乃君子之防。
- n: 141
  text: 舌齩只為揉，齒落皆因眶。
- n: 142
  text: 硬弩絃先斷，鋼刀刃自傷。
- n: 143
  text: 賊名難受，龜名難當。
- n: 144
  text: 好事他人未見講，錯處他偏說得長。
- n: 145
  text: 男子無志純鐵無鋼，女子無志爛草無瓤。
- n: 146
  text: 生男欲得成龍猶恐成麞，生女欲得成鳳猶恐成虎。
- n: 147
  text: 養男莫聽狂言，養女莫叫離母。
- n: 148
  text: 男子失教必愚頑，女子失教定粗魯。
- n: 149
  text: 生男莫教弓與弩，生女莫教歌與舞。
- n: 150
  text: 學成弓弩沙塲災，學成歌舞為人妾。
- n: 151
  text: 財交者密，財盡者疏。
- n: 152
  text: 婚姻論財，夫妻之道。
- n: 153
  text: 色嬌者親，色衰者疏。
- n: 154
  text: 少實勝虛，巧不如拙。
- n: 155
  text: 百戰百勝不如無爭，萬言萬中不如一默。
- n: 156
  text: 有錢不置怨逆産，冤家宜解不宜結。
- n: 157
  text: 近朱者赤，近墨者黑。
- n: 158
  text: 一個山頭一隻虎，惡龍難鬬地頭蛇。
- n: 159
  text: 出門看天色，進門看臉色。
- n: 160
  text: 商賈買賣如施舍，買賣公平如積德。
- n: 161
  text: 天生一人，地生一穴。
- n: 162
  text: 家無三年之積不成其家，國無九年之積不成其國。
- n: 163
  text: 男子有德便是才，女子無才便是德。
- n: 164
  text: 有錢難買子孫賢，女兒不請上門客。
- n: 165
  text: 男大當婚女大當嫁，不婚不嫁惹出笑話。
- n: 166
  text: 謙虛美德，過謙即詐。
- n: 167
  text: 自己跌倒自己爬，望人扶持都是假。
- n: 168
  text: 人不知己過，牛不知力大。
- n: 169
  text: 一家飽暖千家怨，一物不見賴千家。
- n: 170
  text: 當面論人惹恨最大，是與不是隨他說吧！
- n: 171
  text: 誰人做得千年主，轉眼流傳八百家。
- n: 172
  text: 滿載芝麻都漏了，還在水裏撈油花！
- n: 173
  text: 皇帝坐北京，以理統天下。
- n: 174
  text: 五百年前共一家，不同祖宗也同華！
- n: 175
  text: 學堂大如官廳，人情大過王法。
- n: 176
  text: 找錢猶如針挑土，用錢猶如水推沙！
- n: 177
  text: 害人之心不可有，防人之心不可無！
- n: 178
  text: 不愁無路，就怕不做。
- n: 179
  text: 須向根頭尋活計，莫從體面下功夫！
- n: 180
  text: 禍從口出，病從口入。
- n: 181
  text: 藥補不如肉補，肉補不如養補。
- n: 182
  text: 思慮之害甚於酒色，日日勞力上牀呼疾。
- n: 183
  text: 人怕不是福，人欺不是辱。
- n: 184
  text: 能言不是真君子，善處方為大丈夫！
- n: 185
  text: 為人莫犯法，犯法身無主。
- n: 186
  text: 姊妹同肝膽，弟兄同骨肉。
- n: 187
  text: 慈母多誤子，悍婦必欺夫！
- n: 188
  text: 君子千里同舟，小人隔牆易宿。
- n: 189
  text: 文錢逼死英雄漢，財不歸身恰是無。
- n: 190
  text: 妻子如衣服，弟兄似手足。
- n: 191
  text: 衣服補易新，手足斷難續。
- n: 192
  text: 盜賊怨失主，不孝怨父母。
- n: 193
  text: 一時勸人以口，百世勸人以書。
- n: 194
  text: 我不如人我無其福，人不如我我常知足！
- n: 195
  text: 撿金不忘失金人，三兩黃銅四兩福。
- n: 196
  text: 因禍得福，求賭必輸。
- n: 197
  text: 一言而讓他人之禍，一忿而折平生之福。
- n: 198
  text: 天有不測風雲，人有旦夕禍福。
- n: 199
  text: 不淫當齋，淡飽當肉。
- n: 200
  text: 緩步當車，無禍當福。
- n: 201
  text: 男無良友不知己之有過，女無明鏡不知面之精粗。
- n: 202
  text: 事非親做，不知難處。
- n: 203
  text: 十年易讀舉子，百年難淘江湖！
- n: 204
  text: 積錢不如積德，閑坐不如看書。
- n: 205
  text: 思量挑擔苦，空手做是福。
- n: 206
  text: 時來易借銀千兩，運去難賒酒半壺。
- n: 207
  text: 天晴打過落雨鋪，少時享過老來福。
- n: 208
  text: 與人方便自己方便，一家打牆兩家好看。
- n: 209
  text: 當面留一綫，過後好相見。
- n: 210
  text: 入門掠虎易，開口告人難。
- n: 211
  text: 手指要往內撇，家醜不可外傳。
- n: 212
  text: 浪子出於祖無德，孝子出於前人賢。
- n: 213
  text: 貨離鄉貴，人離鄉賤。
- n: 214
  text: 樹挪死，人挪活。
- n: 215
  text: 在家千日好，出門處處難。
- n: 216
  text: 三員長者當官員，幾個明人當知縣？
- n: 217
  text: 明人自斷，愚人官斷。
- n: 218
  text: 人怕三見面，樹怕一墨綫。
- n: 219
  text: 邨夫硬似鐵，光棍軟如棉。
- n: 220
  text: 不是撐船手，怎敢拏篙竿！
- n: 221
  text: 天下禮儀無窮，一人知識有限。
- n: 222
  text: 一人不得二人計，宋江難結萬人緣。
- n: 223
  text: 家有三畝田，不離衙門前，鄉間無強漢，衙門就餓飯。
- n: 224
  text: 人人依禮儀，天下不設官。
- n: 225
  text: 衙門錢，眼睛錢；
- n: 226
  text: 田禾錢，千萬年。
- n: 227
  text: 詩書必讀，不可做官。
- n: 228
  text: 為人莫當官，當官皆一般。
- n: 229
  text: 換了你我去，恐比他還貪。
- n: 230
  text: 官吏清廉如修行，書差方便如行善。
- n: 231
  text: 靠山喫山，種田喫田。
- n: 232
  text: 喫盡美味還是鹽，穿盡綾羅還是棉。
- n: 233
  text: 一夫不耕，全家餓飯，一女不織，全家受寒。
- n: 234
  text: 金銀到手非容易，用時方知來時難。
- n: 235
  text: 先講斷，後不亂，免得藕斷絲不斷。
- n: 236
  text: 聽人勸，得一半。
- n: 237
  text: 不怕慢，只怕站。
- n: 238
  text: 逢快莫赶，逢賤莫懶。
- n: 239
  text: 謀事在人，成事在天！
- n: 240
  text: 長路人挑擔，短路人賺錢。
- n: 241
  text: 寧賣現二，莫賣賒三。
- n: 242
  text: 賺錢往前算，折本往後算。
- n: 243
  text: 小小生意賺大錢，七十二行出狀元。
- n: 244
  text: 自己無運至，卻怨世界難。
- n: 245
  text: 膽大不如膽小，心寛甚如屋寛。
- n: 246
  text: 妻賢何愁家不富，子孫何須受祖田。
- n: 247
  text: 是兒不死，是財不散。
- n: 248
  text: 財來生我易，我去生財難。
- n: 249
  text: 十月灘頭坐，一日下九灘。
- n: 250
  text: 結交一人難上難，得罪一人一時間。
- n: 251
  text: 借債經商，賣田還債；
- n: 252
  text: 賒錢起屋，賣屋還錢。
- n: 253
  text: 修起廟來鬼都老，拾得秤來薑賣完。
- n: 254
  text: 不嫖莫轉，不賭莫看。
- n: 255
  text: 節食以去病，少食以延年。
- n: 256
  text: 豆腐多了是包水，梢公多了打爛船。
- n: 257
  text: 無口過是，無眼過難。
- n: 258
  text: 無身過易，無心過難。
- n: 259
  text: 不會鳧水怨河灣，不會犂田怨枷擔。
- n: 260
  text: 他馬莫騎，他弓莫挽。
- n: 261
  text: 要知心腹事，但聽口中言。
- n: 262
  text: 寧在人前全不會，莫在人前會不全。
- n: 263
  text: 事非親見，切莫亂談。
- n: 264
  text: 打人莫打臉，駡人莫駡短。
- n: 265
  text: 好言一句三冬暖，話不投機六月寒。
- n: 266
  text: 人上十口難盤，帳上萬元難還。
- n: 267
  text: 放債如施，收債如討。
- n: 268
  text: 告狀討錢，海底摸鹽。
- n: 269
  text: 衙門深似海，弊病大如天。
- n: 270
  text: 銀錢莫欺騙，牛馬不好變。
- n: 271
  text: 好漢莫被人識破，看破不值半文錢。
- n: 272
  text: 狗齩對頭人，雷打三世冤。
- n: 273
  text: 不賣香燒無賸錢，井水不打不滿邊。
- n: 274
  text: 事寛則園，太久則偏。
- n: 275
  text: 高人求低易，低人求高難。
- n: 276
  text: 有錢就是男子漢，無錢就是漢子難。
- n: 277
  text: 人上一百，手藝齊全。
- n: 278
  text: 難者不會，會者不難。
- n: 279
  text: 生就木頭造就船，砍的沒得車的圓。
- n: 280
  text: 心不得滿，事不得全。
- n: 281
  text: 鳥飛不盡，話說不完。
- n: 282
  text: 人無喜色休開店，事不遂心莫怨天。
- n: 283
  text: 選婿莫選田園，選女莫選嫁奩。
- n: 284
  text: 紅顏女子多薄命，福人出在醜人邊。
- n: 285
  text: 人將禮義為先，樹將花果為園。
- n: 286
  text: 臨危許行善，過後心又變。
- n: 287
  text: 天意違可以人回，命早定可以心挽。
- n: 288
  text: 強盜口內出赦書，君子口中無戲言。
- n: 289
  text: 貴人語少，貧子話多。
- n: 290
  text: 快裏須斟酌，耽誤莫遲春。
- n: 291
  text: 讀過古華佗，不如見癥多。
- n: 292
  text: 東屋未補西屋破，前帳未還後又拖。
- n: 293
  text: 今年又說明年富，待到明年差不多。
- n: 294
  text: 志不同己，不必強合。
- n: 295
  text: 莫道坐中安樂少，須知世上苦情多。
- n: 296
  text: 本少利微強如坐，屋檐水也滴得多。
- n: 297
  text: 勤儉持家富，謙恭受益多。
- n: 298
  text: 細處不斷粗處斷，黃梅不落靑梅落。
- n: 299
  text: 見錢起意便是賊，順手牽羊乃為盜。
- n: 300
  text: 要做快活人，切莫尋煩惱。
- n: 301
  text: 要做長壽人，莫做短命事。
- n: 302
  text: 要做有後人，莫做無後事。
- n: 303
  text: 不經一事，不長一智。
- n: 304
  text: 寧可無錢使，不可無行止。
- n: 305
  text: 栽樹要栽松柏，結交要結君子。
- n: 306
  text: 秀才不出門，能知天下事。
- n: 307
  text: 錢多不經用，兒多不耐死。
- n: 308
  text: 弟兄爭財家不窮不止，妻妾爭風夫不死不止。
- n: 309
  text: 男人有志，婦人有勢。
- n: 310
  text: 夫人死百將臨門，將軍死一卒不至。
- n: 311
  text: 天旱誤甲子，人窮誤口齒。
- n: 312
  text: 百歲無多日，光陰能幾時？
- n: 313
  text: 父母養其身，自己立其志。
- n: 314
  text: 待有餘而濟人，終無濟人之日；
- n: 315
  text: 待有閑而讀書，終無讀書之時。
- n: 316
  text: 此書傳後世，句句必精讀，其中禮和義，奉勸告世人。
- n: 317
  text: 勤奮讀，苦發奮，走遍天涯如遊刃。
