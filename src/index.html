<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <!-- The page mixes Chinese and English on purpose; browser translation would replace one with the other. -->
    <meta name="google" content="notranslate" />
    <title>賢文 Worthy Words: 增廣賢文 for everyday life</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Learn 增廣賢文, the classical Chinese book of proverbs, with Jyutping, Pinyin, Cantonese and English. Free, open source, works offline."
    />
    <!--
      Only this site and Anthropic's API (for the optional bring-your-own-key AI)
      may be reached. GitHub Pages can't send headers, so the policy is set here.
      'wasm-unsafe-eval' lets SQLite's WebAssembly run; 'unsafe-inline' for styles
      is needed by Angular's component styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#a3271f" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>賢文 Worthy Words needs JavaScript to run.</noscript>
  </body>
</html>
